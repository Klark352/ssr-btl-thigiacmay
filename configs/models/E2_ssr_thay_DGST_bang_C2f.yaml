# E2: YOLO-SSR nhưng thay bốn khối DGST ở phần head bằng C2f chuẩn của YOLOv8.
# Giữ nguyên TriPAC, SPDC, bố cục lớp và hai đầu Detect, Segment_v3, nên đây là thí nghiệm bỏ đúng một thành phần.
tnc: 2  # number of classes

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

scale: n

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 1, TriPAC, [128, [1, 3], 'shallow']]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 1, TriPAC, [256, [1, 3], 'shallow']]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 1, TriPAC, []]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 1, TriPAC, []]
  - [-1, 1, SPPF, [1024, 5]]  # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 12 (SSR: DGST)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [ 2, 1, SPDC, [ 256 ] ] # 14 (P3/8-small)
  - [[-1, -2, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 1, TriPAC, []] # 16
  - [-1, 3, C2f, [256]]  # 17 (P3/8-small) (SSR: DGST)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]  # 20 (P4/16-medium) (SSR: DGST)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [1024]]  # 23 (P5/32-large) (SSR: DGST)

  # Nhánh phân đoạn
  - [23, 1, nn.Upsample, [None, 4, 'nearest']]
  - [20, 1, nn.Upsample, [None, 2, 'nearest']]

  - [[-1, -2, 17], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, TriPAC, []]  # 28

  - [[17, 20, 23], 1, Detect, [1]]  # 29
  - [[28], 1, Segment_v3, [1]]  # 30
